# Builds the signed iPhone app and uploads it to App Store Connect (TestFlight).
# Run it by hand: GitHub > Actions > "iOS to TestFlight" > Run workflow.
# It needs seven repository secrets, described in docs/APP-STORE-STEPS.md:
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (upload)
#   IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD, IOS_PROFILE_BASE64 (Apple Distribution signing)
name: iOS to TestFlight
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version shown in the store (for example 1.0)'
        required: true
        default: '1.0'
      runner:
        description: 'GitHub Mac to build on (try another one if the build waits in the queue and is cancelled)'
        required: true
        default: 'macos-15-intel'
        type: choice
        options: [macos-15-intel, macos-15, macos-26]
jobs:
  release:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: Use Xcode 26 (App Store uploads need the iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install and sync the game into the app
        working-directory: app
        run: |
          npm ci
          npm run sync
      - name: Refuse to release with test ad IDs
        run: |
          if grep -q '3940256099942544' app/native/config.js app/ios/App/App/Info.plist; then
            echo "::warning::The ad IDs are still Google's test IDs. This build is fine for TestFlight testing, but must not be submitted for review."
          fi
      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # Rebuild a clean PEM file whatever way the key was pasted (Windows line ends,
          # one long line, missing BEGIN/END lines, stray spaces). Only the base64 body is kept.
          BODY=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \n\t')
          if [ -z "$BODY" ]; then echo "::error::The ASC_KEY_P8 secret is empty."; exit 1; fi
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$BODY" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$RUNNER_TEMP/keys/AuthKey.p8"
          if ! openssl pkey -in "$RUNNER_TEMP/keys/AuthKey.p8" -noout 2>/dev/null; then
            echo "::error::The ASC_KEY_P8 secret is not a valid private key. Paste the whole .p8 file again (see docs/APP-STORE-STEPS.md, step 4)."
            exit 1
          fi
          echo "The App Store Connect key reads correctly (${#BODY} characters)."
      - name: Install the distribution certificate and the App Store profile
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in P12_BASE64 P12_PASSWORD PROFILE_BASE64; do
            if [ -z "${!v}" ]; then echo "::error::A signing secret is missing (IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD, IOS_PROFILE_BASE64). See docs/APP-STORE-STEPS.md, step 4."; exit 1; fi
          done
          S="$RUNNER_TEMP/signing"; mkdir -p "$S"
          printf '%s' "$P12_BASE64" | tr -d ' \r\n' | base64 --decode > "$S/dist.p12"
          printf '%s' "$PROFILE_BASE64" | tr -d ' \r\n' | base64 --decode > "$S/app.mobileprovision"
          # A keychain of its own, deleted at the end of the run
          KC="$S/build.keychain-db"; KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$S/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          # The provisioning profile
          security cms -D -i "$S/app.mobileprovision" > "$S/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$S/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$S/profile.plist")
          echo "Profile: $NAME ($UUID), expires $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$S/profile.plist")"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$S/app.mobileprovision" "$d/$UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          # Manual distribution signing for the App target's Release build only
          # (the Swift packages are not signed separately and must not get a profile).
          python3 - "$NAME" "$TEAM" <<'PY'
          import sys, re
          name, team = sys.argv[1], sys.argv[2]
          p = 'app/ios/App/App.xcodeproj/project.pbxproj'
          s = open(p).read()
          m = re.search(r'(/\* Release \*/ = \{\s*isa = XCBuildConfiguration;\s*buildSettings = \{)([^}]*?PRODUCT_BUNDLE_IDENTIFIER = com\.bobshousedefense\.game;[^}]*?)(\};\s*name = Release;)', s)
          if not m:
              sys.exit('App target Release settings not found in project.pbxproj')
          body = m.group(2).replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
          body = body.rstrip() + '\n'
          body += ('\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n'
                   '\t\t\t\tDEVELOPMENT_TEAM = %s;\n'
                   '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "%s";\n\t\t\t' % (team, name))
          open(p, 'w').write(s[:m.start(2)] + body + s[m.end(2):])
          print('App target Release: manual signing with', name)
          PY
      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild -project app/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGN_KEYCHAIN" archive | tail -40
          echo "Entitlements of the archived app:"
          codesign -d --entitlements - "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" 2>&1 | tail -20
      - name: Upload to App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          sed 's/^ *//' > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.bobshousedefense.game</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/out" -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -40
      - name: Remove the key and the signing files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing"
          [ -n "$SIGN_KEYCHAIN" ] && security delete-keychain "$SIGN_KEYCHAIN" 2>/dev/null || true
