# Builds the signed iPhone app and uploads it to App Store Connect (TestFlight).
# Run it by hand: GitHub > Actions > "iOS to TestFlight" > Run workflow.
# It needs four repository secrets, described in docs/APP-STORE-STEPS.md:
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
name: iOS to TestFlight
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version shown in the store (for example 1.0)'
        required: true
        default: '1.0'
      runner:
        description: 'GitHub Mac to build on (try another one if the build waits in the queue and is cancelled)'
        required: true
        default: 'macos-15-intel'
        type: choice
        options: [macos-15-intel, macos-15, macos-26]
jobs:
  release:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: Use Xcode 26 (App Store uploads need the iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install and sync the game into the app
        working-directory: app
        run: |
          npm ci
          npm run sync
      - name: Refuse to release with test ad IDs
        run: |
          if grep -q '3940256099942544' app/native/config.js app/ios/App/App/Info.plist; then
            echo "::warning::The ad IDs are still Google's test IDs. This build is fine for TestFlight testing, but must not be submitted for review."
          fi
      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # Rebuild a clean PEM file whatever way the key was pasted (Windows line ends,
          # one long line, missing BEGIN/END lines, stray spaces). Only the base64 body is kept.
          BODY=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \n\t')
          if [ -z "$BODY" ]; then echo "::error::The ASC_KEY_P8 secret is empty."; exit 1; fi
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$BODY" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$RUNNER_TEMP/keys/AuthKey.p8"
          if ! openssl pkey -in "$RUNNER_TEMP/keys/AuthKey.p8" -noout 2>/dev/null; then
            echo "::error::The ASC_KEY_P8 secret is not a valid private key. Paste the whole .p8 file again (see docs/APP-STORE-STEPS.md, step 4)."
            exit 1
          fi
          echo "The App Store Connect key reads correctly (${#BODY} characters)."
      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project app/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" archive | tail -40
      - name: Upload to App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          sed 's/^ *//' > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/out" -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -40
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
