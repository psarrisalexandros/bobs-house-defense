# Compiles the Android app as a debug build. It proves the project builds, and leaves an APK
# that can be installed on an Android phone for testing (Actions > the run > Artifacts). It uploads nothing to Google.
name: Android build check
on:
  push:
    branches: [android-app, main]
    paths: ['app/**', 'index.html', '.github/workflows/android-check.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Install and sync the game into the app
        working-directory: app
        run: |
          npm ci
          npm run sync:android
      - name: Build the debug APK
        working-directory: app/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug lintDebug > build.log 2>&1 || { grep -E "error:|FAILED|What went wrong" -A3 build.log | head -40 | while read -r l; do echo "::error::$l"; done; tail -80 build.log; exit 1; }
          echo "::notice::$(grep -E 'BUILD SUCCESSFUL' build.log | head -1)"
      - name: What is inside
        working-directory: app/android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump badging $APK > badging.txt
          echo "::notice::$(grep -E '^package' badging.txt | cut -c1-140) / min SDK $(grep -oE "^sdkVersion:'[0-9]+'" badging.txt | grep -oE '[0-9]+') / target SDK $(grep -oE "targetSdkVersion:'[0-9]+'" badging.txt | grep -oE '[0-9]+')"
          echo "::notice::permissions: $(grep -oE "uses-permission: name='[^']+'" badging.txt | sed "s/.*name='//;s/'//;s/.*\.//" | tr '\n' ' ')"
          unzip -l $APK | grep -E "assets/public/(index.html|native.js|config.js|cordova_plugins.js)" || { echo "::error::the game files are missing from the APK"; exit 1; }
          # 16 KB page size: every native library must be aligned for it
          unzip -l $APK | grep -c "\.so$" | xargs -I{} echo "::notice::native libraries in the APK: {}"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/zipalign -c -P 16 -v 4 $APK > align.log 2>&1 && echo "::notice::16 KB page alignment: OK" || { tail -5 align.log; echo "::warning::16 KB page alignment check did not pass"; }
      - uses: actions/upload-artifact@v4
        with:
          name: bobs-house-defense-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
