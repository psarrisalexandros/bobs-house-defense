/* Layout: the playfield sits in the middle with its HUD, skills and a small decision desk; the six upgrade
   lines live in two side panels (three tabs each) so every purchase is visible on the playfield at once.
   One committed look: cartoon dusk, sticker-style cards with hard offset shadows. */
:root{
  color-scheme:dark;
  --ink:#16122e;        /* page ground, outlines */
  --desk:#231d47;       /* panels */
  --desk-2:#30285e;
  --paper:#fff1d0;      /* text */
  --muted:#b9add9;
  --pumpkin:#ff8a3c;    /* weapons, primary action */
  --plank:#f2c14e;      /* fence, coins */
  --brick:#5fc9c0;      /* house */
  --folk:#f29bc0;       /* people */
  --slime:#8fd14f;      /* obstacles */
  --steel:#a9b8d6;      /* fortification */
  --hurt:#ff5d73;
  --display:"M PLUS Rounded 1c","Trebuchet MS","Segoe UI",sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-inline:16px;padding-block:12px}
.app{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr) minmax(220px,300px);gap:14px;max-width:1580px;margin-inline:auto;align-items:start}
.mid{display:flex;flex-direction:column;gap:10px;min-width:0}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.hud h1{font-family:var(--display);font-weight:900;font-size:20px;margin:0;letter-spacing:.01em;flex:1 1 auto;min-width:0}
.hud h1 span{color:var(--pumpkin)}
.stat{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.stat b{font-family:var(--display);font-weight:800;font-size:18px}
.stat.coin b{color:var(--plank)}
.bars{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.bar{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;flex:1 1 180px;min-width:0}
.track{flex:1;height:14px;background:var(--desk);border:2px solid var(--ink);outline:2px solid var(--desk-2);border-radius:8px;overflow:hidden;min-width:50px}
.track i{display:block;height:100%;width:100%;background:var(--brick);transition:width .15s}
.bar.fence .track i{background:var(--plank)}
.bar .num{font-family:var(--display);font-weight:800;min-width:4.5em;text-align:right}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
.tog{font-family:var(--display);font-weight:800;font-size:13px;background:var(--desk-2);border:2px solid var(--muted);
  border-radius:10px;padding:4px 10px;white-space:nowrap}
.tog:hover{background:var(--desk)}
.tog[aria-pressed="true"]{background:var(--plank);color:var(--ink);border-color:var(--ink)}
.tog.speed{font-size:16px;min-width:52px}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;
  border:3px solid var(--desk-2);background:#23235e}
canvas{display:block;width:100%;height:100%;cursor:pointer}
.toast{position:absolute;left:12px;right:12px;bottom:10px;margin-inline:auto;max-width:600px;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:6px 14px;font-weight:700;text-align:center;
  font-size:14px;line-height:1.3;cursor:pointer}
.desk{background:var(--desk);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.desk h2{font-family:var(--display);font-weight:900;font-size:20px;margin:0;text-wrap:balance}
.desk p{margin:0;max-width:65ch;color:var(--muted)}
.desk p strong{color:var(--paper)}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.go{font-family:var(--display);font-weight:900;font-size:17px;background:var(--pumpkin);color:var(--ink);
  border:3px solid var(--ink);border-radius:12px;padding:7px 20px;box-shadow:4px 4px 0 var(--ink),4px 4px 0 2px var(--desk-2)}
.go:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.go.alt{background:var(--plank)}
.go.quiet{background:var(--desk-2);color:var(--paper);font-size:14px}
.go[disabled]{opacity:.45;cursor:default}
.subhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.log summary{cursor:pointer;font-weight:700;color:var(--folk)}
.log ol{margin:8px 0 0;padding-left:22px;color:var(--muted);display:flex;flex-direction:column;gap:4px;max-width:70ch;max-height:180px;overflow-y:auto}
/* player skills */
.skills{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:8px}
.auto{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;line-height:1.1;background:var(--desk);border:2px solid var(--desk-2);border-radius:10px;padding:2px 6px;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg)}
.auto[aria-pressed="true"]{background:var(--plank);color:var(--ink);border-color:var(--ink)}
.skill{position:relative;overflow:hidden;text-align:left;background:var(--desk);border:2px solid var(--desk-2);border-radius:12px;
  padding:6px 10px;min-width:0;display:flex;flex-direction:column;gap:1px}
.skill i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--desk-2);transition:width 1s linear}
.skill span{position:relative}
.skill .sn{font-family:var(--display);font-weight:900;font-size:14px}
.skill.ready{border-color:var(--plank)} .skill.ready .sn{color:var(--plank)}
.skill.ready:not([disabled]):hover{background:var(--desk-2)}
.skill.locked{border-style:dashed;opacity:.7}
.skill[disabled]{cursor:default}
/* side panels with the upgrade lines */
.side{background:var(--desk);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;position:sticky;top:12px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.tab{--c:var(--pumpkin);font-family:var(--display);font-weight:800;font-size:12px;line-height:1.15;background:var(--desk-2);border:2px solid transparent;
  border-radius:9px;padding:6px 4px;min-width:0;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--c);color:var(--ink);border-color:var(--ink)}
.t-guns{--c:var(--pumpkin)} .t-fence{--c:var(--plank)} .t-obst{--c:var(--slime)} .t-size{--c:var(--brick)} .t-fort{--c:var(--steel)} .t-people{--c:var(--folk)}
.nodes{display:flex;flex-direction:column;gap:5px}
.node{display:flex;gap:8px;align-items:flex-start;text-align:left;background:var(--desk-2);border:2px solid transparent;
  border-radius:10px;padding:5px 8px;min-width:0;font-size:12px;line-height:1.28}
.node .ic{width:32px;height:32px;flex:none;background:var(--ink);border-radius:8px;padding:3px;margin-top:1px}
.node .ic *{stroke:#16122e;stroke-width:1.1;stroke-linejoin:round;stroke-linecap:round}
.node .tx{display:flex;flex-direction:column;gap:0;min-width:0;flex:1}
.node .n{font-family:var(--display);font-weight:800;font-size:13.5px;display:flex;justify-content:space-between;gap:6px}
.node .n i{font-style:normal;color:var(--c);font-variant-numeric:tabular-nums;white-space:nowrap}
.node .d{color:var(--muted)}
.node .p{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.node.can{border-color:var(--c)} .node.can .p{color:var(--plank)}
.node.can:hover{background:var(--ink)}
.node.locked{background:transparent;border:2px dashed var(--desk-2);opacity:.85}
.node.maxed{border-color:var(--plank);background:linear-gradient(90deg,#4a3f2a,var(--desk-2))} .node.maxed .p,.node.maxed .n i{color:var(--plank)}
.tab{position:relative}
.tab.done{box-shadow:inset 0 -4px 0 var(--plank);color:var(--plank)}
.tab.done[aria-selected="true"]{color:var(--ink)}
.tab.new::after{content:"";position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--hurt);border:2px solid var(--ink)}
.warn{display:flex;gap:12px;align-items:center;background:var(--desk-2);border:2px solid var(--hurt);border-radius:12px;padding:8px 12px;min-width:0}
.warn img{width:96px;height:80px;flex:none;background:var(--ink);border-radius:10px}
.warn div{display:flex;flex-direction:column;gap:2px;min-width:0}
.warn b{font-family:var(--display);font-weight:900;font-size:17px}
.warn span{color:var(--muted);font-size:13.5px} .warn span strong{color:var(--paper)}
.node[disabled]{cursor:default}
@media (max-width:1080px){
  .app{grid-template-columns:1fr 1fr}
  .mid{grid-column:1/-1;order:-1}
  .side{position:static}
}
@media (max-width:640px){
  .app{grid-template-columns:1fr}
  .skills{grid-template-columns:auto repeat(2,minmax(0,1fr))}
  .auto{grid-row:span 2}
  .toast{font-size:12px;padding:5px 10px}
}

/* a dot marks what you can pay for right now: on the tab and on the upgrade itself */
.node.can{position:relative}
.node.can::after{content:"";position:absolute;top:-4px;left:-4px;width:11px;height:11px;border-radius:50%;background:var(--hurt);border:2px solid var(--ink)}
.tog.new{position:relative}
.tog.new::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--hurt);border:2px solid var(--ink)}
/* phone: everything on one screen, nothing scrolls except the upgrade list.

html.phone .skill .st{font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.phone .toast{font-size:11px;padding:4px 8px;left:6px;right:6px;bottom:6px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
.panel{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;background:var(--desk);padding:6px 8px;overflow:hidden}
.panel[hidden]{display:none}
.panel .desk{padding:0 4px 4px 0;gap:6px;background:none;border-radius:0;flex:none;max-height:48%;overflow-y:auto}

.app.land .panel .nodes{overflow:visible}
.panel .nodes{flex:1;min-height:0;grid-auto-rows:max-content;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));align-content:start;gap:6px;padding:5px 3px 3px 5px}
.panel .opts{display:flex;gap:6px;flex:none;flex-wrap:wrap}

/* ---------- persistent state ---------- */
/* Two save slots, the real game and the Sandbox. Each is written to localStorage with the previous good copy kept beside it,
   and mirrored to IndexedDB. What was bought lives in its own record, so starting over never loses it. */
let STORE_OK=true;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){STORE_OK=false;return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){STORE_OK=false;return false;}}
function parseSave(txt){try{const o=JSON.parse(txt||'null');return o&&typeof o==='object'&&o.T&&typeof o.T==='object'&&typeof o.wave==='number'&&o.wave>=1?o:null;}catch(e){return null;}}
const SLOT=lsGet(KEY+'-slot')==='sand'?'sand':'main',SKEY=KEY+(SLOT==='sand'?'-sand':'');
let M={T:{},bank:0,best:0,wave:1,house:null,fence:null,log:[],god:false,auto:false,autoSkill:false};
{const s=parseSave(lsGet(SKEY))||parseSave(lsGet(SKEY+'-bak'));if(s)M=Object.assign(M,s);}   /* a damaged save falls back to the copy before it */
M.god=SLOT==='sand';
let OWN={};try{OWN=JSON.parse(lsGet(KEY+'-own')||'{}')||{};}catch(e){OWN={};}
function has(k){return !!(OWN.all||OWN[k]||(k==='x2'&&OWN.x3));}
function noAds(){return has('noads');}
let IDB=null;
function idbOpen(cb){try{const r=indexedDB.open('bobs-house-defense',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{IDB=r.result;cb();};r.onerror=()=>{};}catch(e){}}
function idbPut(k,v){try{if(IDB)IDB.transaction('kv','readwrite').objectStore('kv').put(v,k);}catch(e){}}
function idbGet(k,cb){try{if(!IDB)return cb(null);const r=IDB.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>cb(r.result||null);r.onerror=()=>cb(null);}catch(e){cb(null);}}
/* the store versions inject window.BobCloud = {put(key,text), get(key,callback)}: a copy tied to the player's Apple or Google account, which is what survives a reinstall */
function cloudPut(k,v){try{if(window.BobCloud)window.BobCloud.put(k,v);}catch(e){}}
function cloudGet(k,cb){try{if(window.BobCloud)window.BobCloud.get(k,cb);}catch(e){}}
function saveOwn(){const t=JSON.stringify(OWN);lsSet(KEY+'-own',t);idbPut(KEY+'-own',t);cloudPut(KEY+'-own',t);}
let FROZEN=false;                                 /* set just before a reload that must not overwrite what was written */
function save(){
  if(G.sim||FROZEN)return;M.house=G.house;M.fence=G.fence;M.ts=Date.now();
  const txt=JSON.stringify(M),old=lsGet(SKEY);
  if(old&&old!==txt&&parseSave(old))lsSet(SKEY+'-bak',old);
  lsSet(SKEY,txt);idbPut(SKEY,txt);cloudPut(SKEY,txt);
}

function houseMax(){return 100+FOUND[tl('found')]+FLOOR[tl('floors')]+40*tl('basement')+60*tl('attic')+fortSum('hp')+15*PEOPLE.filter(p=>tl(p)).length+(AD(5)?400:0);}

function houseHit(d){d=Math.min(d,BAL.hit*houseMax())*armorNow();   /* no single blow takes more than a set share of the house, so one car cannot decide a wave */
  if(G.dome>0&&!(G.dark>0)){const a=Math.min(G.dome,d);G.dome-=a;d-=a;}G.house-=d;G.shake=.15;if(G.house<=0){G.house=0;return true;}return false;}

  else if(duo){put(.4,[duo[0],BAL.duo]);put(.6,[duo[1],BAL.duo]);}

/* how much tougher wave w is than wave 1 */
function scaleOf(w){
  /* zombie health follows a table with one value every five waves (wave 1, 5, 10 ... 100), blended smoothly in between and extended past 100 */
  const T=BAL.tab,x=w<=1?0:w<5?(w-1)/4:Math.min(T.length-1.001,w/5),i=Math.floor(x),f=x-i;
  let hp=Math.exp(Math.log(T[i])*(1-f)+Math.log(T[Math.min(T.length-1,i+1)])*f)*BAL.mul;
  if(w>100)hp*=Math.pow(1.06,w-100);
  return {hp:BAL.force||hp*D().hp,dmg:Math.min(1,BAL.ease+BAL.easeStep*w)*Math.pow(1+BAL.b*(w-1),BAL.q)*D().bite};
}

function update(dt){
  G.time+=dt;

  if(G.shake>0)G.shake-=dt;

  }
  for(const z of G.zombies){
    if(z.dead)continue;

    }
    if(z.frozen>0){z.frozen-=dt;z.v=0;if(holyWater)sear(z,z.max*BAL.pct*((z.t.boss||z.thick)?.015:.05)*dt);continue;}
    if(z.held>0){z.held-=dt;z.v=0;continue;}
    z.anim+=dt;z.age+=dt;

        else{z.dead=true;addCoins(z.t.coin);if(!G.sim)for(let i=0;i<8;i++)G.parts.push({x:z.x,y:GROUND-20,vx:(Math.random()-.5)*200,vy:-Math.random()*220,t:.7,c:'#3d3852',s:5});}

          }
          if(b.p>0){b.p--;b.d*=BAL.fall;}else{b.gone=true;break;}   /* every zombie a bullet goes through takes some of its force */
        }
      }
    }
  }
  G.bullets=G.bullets.filter(b=>!b.gone);
  G.zombies=G.zombies.filter(z=>!z.dead);
  if(!G.queue.length&&!G.zombies.length)waveCleared();
}
function waveCleared(){
  sfx('clear');

  const fix=repairShare();
  G.fence=Math.min(fenceMax(),G.fence+fix*fenceMax());G.house=Math.min(houseMax(),G.house+fix*houseMax());
  Object.assign(G,{bullets:[],bombs:[],drops:[],fires:[],throws:[],clouds:[],zaps:[],lobs:[],rockets:[],strike:null,beam:null,car:null,heli:null,missile:null,nbeam:null,mud:0,holy:0,stun:0});
  if(G.wave>M.best)M.best=G.wave;M.fn=0;
  if(G.wave%5===0&&!G.sim)note('~'+boast(G.wave));
  if(!G.sim&&(G.wave===10||G.wave===20)&&!OWN.rated&&SLOT==='main')askRate(G.wave);   /* instead of the ad break */
  else if(G.wave%5===0&&!G.sim&&!has('noads')&&Date.now()-(G.adAt||0)>180000){G.adAt=Date.now();showAd('A short break between waves',null);}
  if(G.wave===100&&!G.sim){M.score=M.bank;M.endless=true;note('Wave 100 beaten on '+D().nm+'. Bob keeps his house! Final score: '+M.bank+' coins left in the piggy bank. From here the game is endless: two mutations in every wave, and the zombies never stop growing.');}
  G.wave++;M.wave=G.wave;G.state='ready';G.autoWait=M.auto&&!G.sim?AUTO_WAIT:0;save();renderDesk();renderSides();
}

function boast(w){return 'Wave '+w+' beaten. '+BOAST[(w/5-1)%BOAST.length];}
function repairShare(){return tl('ross')?.2+.06*tl('ross'):.12;}
/* after a defeat the survivors patch things up overnight: 60%, not good as new */
function patchUp(){G.house=Math.max(G.house,Math.round(houseMax()*.6));G.fence=Math.max(G.fence,Math.round(fenceMax()*.6));}
function saveRepaired(){const h=G.house,f=G.fence;patchUp();save();G.house=h;G.fence=f;}
function gameOver(){
  sfx('over');buzz(250);

/* what the next step of a line is, costs and needs. God mode waives both */
function nextOf(n){
  const l=tl(n.id),st=n.steps[l]||{};
  const req=(n.req||[]).concat(st.req||[]),tier=st.tier||0;
  let missing=req.filter(r=>tl(r[0])<r[1]).map(r=>{const q=NODES.find(x=>x.id===r[0]);return q.tree==='people'&&r[1]===1?q.nm:q.steps[r[1]-1].nm;});
  if(M.god)missing=[];
  if(l===0&&WIN.indexOf(n.id)>=0&&winUsed()>=winCount())missing.push('a free window: build another floor');
  return {l,maxed:l>=n.max,cost:M.god?0:Math.round(Math.max(n.cost*Math.pow(n.grow||1.5,l),tier?(15+BAL.cost*Math.pow(tier,1.3))*(1+BAL.late*Math.max(0,Math.min(1,(tier-30)/20))):0)*BAL.price),missing,msg:st.msg,ds:st.ds,nm:st.nm};
}
/* every purchase says what changed */
function say(s){
  if(G.sim||!s)return;
  const b=s[0]==='~';toast.classList.toggle('boast',b);              /* a leading ~ marks a cheer, which gets its own lettering */
  toast.textContent=b?s.slice(1):s;toast.hidden=false;G.toastT=7;
}
function shut(){return PHONE&&G.state==='wave';}
function note(s){if(PHONE)(G.news=G.news||[]).push(s);else say(s);}
function buyNode(id){
  const n=NODES.find(x=>x.id===id);if(!n||shut())return;
  const nx=nextOf(n);if(nx.maxed||nx.missing.length||M.bank<nx.cost||!slotFree(n.tree))return;
  const before=houseMax(),fb=fenceMax();
  if(nx.l===0&&WIN.indexOf(id)>=0){M.W=M.W||{};const used=WIN.filter(p=>tl(p)).map(p=>M.W[p]);let sl=0;while(used.indexOf(sl)>=0)sl++;M.W[id]=sl;}   /* the next free window */
  M.bank-=nx.cost;M.T[id]=nx.l+1;if(!M.god)G.bought[n.tree]=1;
  sfx('buy');note(nx.msg);M.log.push(nx.msg);
  if(id==='floors'&&unsupported())note('The new floor sways! The house takes more damage until the Foundations are upgraded once more.');
  G.fence=Math.min(fenceMax(),G.fence+fenceMax()-fb);
  if(G.state==='over')saveRepaired();
  else{G.house=Math.min(houseMax(),G.house+houseMax()-before);save();}
  if(G.autoWait>0)G.autoWait=AUTO_WAIT;          /* every purchase restarts the countdown */
  renderSides();if(G.state!=='wave')renderDesk();
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function nodeState(n){
  const nx=nextOf(n),free=slotFree(n.tree),can=!nx.maxed&&!nx.missing.length&&M.bank>=nx.cost&&!shut()&&free;

}
function renderSides(){

    h+='<div class="nodes t-'+cur+'" role="tabpanel">'+NODES.filter(n=>n.tree===cur).map(n=>{

        if(n.tree==='people'||n.max===1){title=n.nm;d=st.nx.maxed?(n.max===1?n.steps[0].ds:'Nothing more to learn'):(n.max===1?st.nx.ds:'Next: '+st.nx.nm+'. '+st.nx.ds);}
        else{title=now;d=st.nx.maxed?'The end of this line':'Next: '+st.nx.nm+'. '+st.nx.ds;}

        '<span class="n"><span>'+esc(title)+'</span><i>'+l+'/'+n.max+'</i></span><span class="d">'+esc(d)+'</span><span class="p">'+esc(st.p)+'</span></span></button>';
    }).join('')+'</div>';

/* coins change all the time: refresh prices and locks in place so a click is never lost */
function refreshSides(){

    const el=$('node-'+n.id);if(!el)continue;

function logHTML(){return M.log.length?'<details class="log"><summary>The story so far ('+M.log.length+')</summary><ol>'+M.log.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol></details>':'';}

desk.addEventListener('click',e=>{

  else if(a==='asknew'){G.askNew=true;G.autoWait=0;renderDesk();}

/* ---------- sound ----------
   Everything is synthesised on the spot: there are no audio files. Sound starts with the first tap, as browsers require. */
const AU={ctx:null,out:null,mus:null,noise:null,t:{},step:0,next:0};
function auOn(){return OWN.snd!==false;}
function au(){
  if(!AU.ctx){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AU.ctx=new C();
    AU.out=AU.ctx.createGain();AU.out.gain.value=.5;AU.out.connect(AU.ctx.destination);AU.mus=AU.ctx.createGain();AU.mus.gain.value=.16;AU.mus.connect(AU.out);
    const n=Math.floor(AU.ctx.sampleRate*.5),b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;AU.noise=b;}catch(e){AU.ctx=null;return null;}}
  return AU.ctx;
}
function tone(type,f0,f1,dur,vol,at,dest){
  const c=AU.ctx,t=c.currentTime+(at||0),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||AU.out);o.start(t);o.stop(t+dur+.02);
}
function hiss(dur,vol,freq,at,q){
  const c=AU.ctx,t=c.currentTime+(at||0),src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();src.buffer=AU.noise;f.type=q?'bandpass':'lowpass';f.frequency.value=freq;if(q)f.Q.value=q;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(f);f.connect(g);g.connect(AU.out);src.start(t);src.stop(t+dur+.02);
}
/* name: [shortest gap between two of them in ms, how it is made] */
const SFX={
  arrow:[60,()=>hiss(.09,.25,2600,0,3)],bullet:[55,()=>{hiss(.05,.3,1800);tone('square',240,90,.05,.12);}],heavy:[80,()=>{hiss(.09,.4,900);tone('square',150,50,.1,.2);}],
  pellet:[90,()=>{hiss(.12,.45,1200);tone('square',120,45,.1,.15);}],small:[45,()=>hiss(.035,.22,2400)],rifle:[50,()=>{hiss(.05,.3,2000);tone('square',300,110,.05,.1);}],
  ak:[55,()=>{hiss(.07,.35,1400);tone('square',200,70,.07,.14);}],laser:[60,()=>tone('sawtooth',1300,280,.11,.1)],
  boom:[110,()=>{hiss(.4,.55,420);tone('sine',110,36,.4,.4);}],pop:[50,()=>tone('triangle',340,120,.07,.12)],bonk:[80,()=>tone('sine',420,160,.1,.25)],
  buy:[0,()=>{tone('triangle',660,660,.09,.18);tone('triangle',880,880,.09,.18,.08);tone('triangle',1320,1320,.16,.18,.16);}],
  tap:[30,()=>tone('sine',720,620,.04,.08)],
  wave:[0,()=>{[392,494,587,784].forEach((f,i)=>tone('triangle',f,f,.14,.18,i*.11));}],
  clear:[0,()=>{[523,659,784,1047].forEach((f,i)=>tone('triangle',f,f,.18,.2,i*.1));}],
  over:[0,()=>{[392,330,262,196].forEach((f,i)=>tone('sawtooth',f,f*.97,.3,.14,i*.22));}],
  skill:[0,()=>{tone('sine',300,900,.25,.18);hiss(.25,.15,3000,0,2);}],boss:[0,()=>{tone('sawtooth',90,60,.7,.25);tone('sawtooth',135,90,.7,.15);}],
  zap:[200,()=>{tone('sawtooth',1100,50,.35,.22);hiss(.3,.3,3200,0,2);}],splash:[120,()=>{hiss(.2,.3,700,0,1);tone('sine',300,90,.14,.12);}]
};
function sfx(k){
  if(G.sim||!auOn()||!AU.ctx||AU.ctx.state!=='running')return;
  const d=SFX[k];if(!d)return;const now=performance.now();if(now-(AU.t[k]||0)<d[0])return;AU.t[k]=now;
  try{d[1]();}catch(e){}
}
function buzz(ms){if(G.sim||OWN.vib===false)return;try{if(window.BobBuzz)window.BobBuzz(ms);else if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
/* music: a quiet sixteen-step loop in A minor, scheduled a little ahead of the clock. Bass between waves, bass and melody during one */
const BASS=[110,110,0,110,131,0,131,0,98,98,0,98,82,0,123,0],LEAD=[440,0,523,0,659,523,0,440,392,0,494,0,587,494,0,392];
function music(){
  const c=AU.ctx;if(!c||c.state!=='running'||OWN.mus===false||!auOn()||document.hidden||G.modal){AU.next=0;return;}
  if(!AU.next||AU.next<c.currentTime)AU.next=c.currentTime+.05;
  const len=G.state==='wave'?.19:.26;
  while(AU.next<c.currentTime+.3){
    const i=AU.step++%16,at=AU.next-c.currentTime;
    try{if(BASS[i])tone('triangle',BASS[i],BASS[i],len*1.6,.5,at,AU.mus);if(LEAD[i]&&G.state==='wave')tone('square',LEAD[i],LEAD[i],len*.8,.12,at,AU.mus);}catch(e){}
    AU.next+=len;
  }
}
setInterval(music,100);
document.addEventListener('pointerdown',e=>{const c=au();if(c&&c.state==='suspended'&&auOn())c.resume();if(e.target.closest&&e.target.closest('button'))sfx('tap');},true);
document.addEventListener('visibilitychange',()=>{if(AU.ctx){if(document.hidden)AU.ctx.suspend();else if(auOn())AU.ctx.resume();}});

/* ---------- drawing ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function fs(fill,lw){ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=lw||3;ctx.strokeStyle=OUT;ctx.stroke();}
function box(x,y,w,h,fill,lw){ctx.beginPath();ctx.rect(x,y,w,h);fs(fill,lw);}
function disc(x,y,r,fill,lw){ctx.beginPath();ctx.arc(x,y,r,0,7);fs(fill,lw);}
function line(x1,y1,x2,y2,c,w){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function glow(x,y,r,c,a){ctx.globalAlpha=Math.max(0,Math.min(1,a));ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,7);ctx.fill();ctx.globalAlpha=1;}

/* slapstick: where a zombie is drawn relative to where it really stands */
function antics(z){
  const o={x:0,y:0,r:0,daze:false};
  if(z.kb>0)o.r=.2;
  if(z.toss>0){const k=1-z.toss/.7;o.y=-Math.sin(k*Math.PI)*120;o.r=k*9;return o;}
  if(z.inMoat>0){
    const T=z.moatT||1.5,e=T-z.inMoat,f=Math.min(1,T/1.5),a=.25*f,b=.7*f,c=.45*f,dx=(z.mx0==null?z.x:z.mx0)-z.x;
    o.c=true;
    if(e<a){o.x=dx;o.y=-22;o.r=Math.sin(e*42)*.16-(e/a)*.4;}                                              /* teetering on the edge */
    else if(e<b){const k=(e-a)/(b-a);o.x=dx*(1-k);o.y=-22*(1-k*k)-Math.sin(k*Math.PI)*18;o.r=-.4-k*2.6;}   /* and over, head first */
    else if(z.inMoat<c){const k=1-z.inMoat/c;o.x=(MOAT_X-4-z.x)*k;o.y=-22*k-Math.sin(k*Math.PI)*7;o.r=-.55*Math.sin(k*Math.PI);o.c=false;}   /* hauling itself out on the near bank */
    else if(e<b+.3*f){const k=(e-b)/(.3*f);o.r=-3*(1-k);o.y=Math.sin(k*Math.PI)*5;}                        /* coming up the right way round */
    else if(tl('moat')>=2){o.c=false;o.y=Math.sin(z.anim*7)*2.5-3;o.r=Math.sin(z.anim*5)*.25;}             /* swimming, badly */
    else{o.c=false;const q=(e-b-.3*f)%1.15;if(q<.75)o.y=-q/.75*15;else{const k=(q-.75)/.4;o.y=-15*(1-k);o.r=-.7*Math.sin(k*Math.PI);}}   /* halfway up the bank, and back down */
    return o;
  }
  if(z.cl>0&&z.clm){
    const H=WALL[tl('wall')][2]*.55,T=z.cl%3.6;
    if(T<1.9)o.y=-H*(T/1.9)+Math.sin(T*20)*1.5;                           /* up the fence, hand over hand */
    else if(T<2.35){const k=(T-1.9)/.45;o.y=-H*(1-k*k);o.r=k*1.5;o.x=k*18;}   /* and off it, backwards */
    else if(T<3.1){o.r=1.5;o.x=18;o.daze=true;}
    else{const k=(T-3.1)/.5;o.r=1.5*(1-k);o.x=18*(1-k);}
  }
  return o;
}

function bolt(x0,y0,x1,y1,col,a,core,thin){

  P.push([x1,y1]);
  const path=pts=>{ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let j=1;j<pts.length;j++)ctx.lineTo(pts[j][0],pts[j][1]);};
  ctx.lineJoin='miter';ctx.lineCap='butt';
  ctx.globalAlpha=a*.25;ctx.strokeStyle=col;ctx.lineWidth=thin?5:12;path(P);ctx.stroke();

  if(!thin){
    const dir=Math.atan2(y1-y0,x1-x0);
    for(let b=0;b<2;b++){
      const p=P[1+Math.floor(Math.random()*(P.length-2))],ang=dir+(Math.random()<.5?-1:1)*(.45+Math.random()*.6),l=16+Math.random()*30;
      path([p,[p[0]+Math.cos(ang)*l*.5+(Math.random()-.5)*10,p[1]+Math.sin(ang)*l*.5+(Math.random()-.5)*10],[p[0]+Math.cos(ang)*l,p[1]+Math.sin(ang)*l]]);

  ctx.globalAlpha=1;ctx.lineJoin='round';ctx.lineCap='round';
}

  const p=flakP(),hasAir=G.state==='wave'&&G.zombies.some(z=>z.fly);

/* what sits in front of whoever is in the moat: the far bank, the water, its residents and the drawbridge */
function croc(cx,y,dir,snap){
  const a=snap?.25+.45*Math.abs(Math.sin(G.time*9+cx)):.06;
  ctx.save();ctx.translate(cx,y);ctx.scale(dir,1);
  rr(-13,-3,15,6,3);fs('#5f8f3a',2);for(let i=0;i<3;i++)poly([-11+i*4,-3,-9+i*4,-7,-7+i*4,-3],'#4f7a45',1.2);
  rr(1,0,15,3.5,1.5);fs('#4f7a45',1.8);
  ctx.save();ctx.translate(1,0);ctx.rotate(-a);rr(0,-4.5,15,4.5,2);fs('#5f8f3a',1.8);
  ctx.fillStyle='#fff1d0';for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(4+i*3,0);ctx.lineTo(5.2+i*3,2.6);ctx.lineTo(6.4+i*3,0);ctx.fill();}
  ctx.restore();
  disc(0,-5.5,2.6,'#ffe27a',1.3);ctx.fillStyle=OUT;ctx.fillRect(-.4,-7.3,1,3.6);
  ctx.restore();
}

function moatFront(dt){
  const m=tl('moat');if(!m)return;
  const mw=moatW(),x=MOAT_X;
  ctx.fillStyle='#2e4a3c';ctx.fillRect(x-6,GROUND+29,mw+12,9);
  if(m>=2){
    ctx.globalAlpha=.66;ctx.fillStyle='#3d7edb';ctx.beginPath();ctx.moveTo(x-2,GROUND+5);ctx.lineTo(x+mw+2,GROUND+5);ctx.lineTo(x+mw-7,GROUND+30);ctx.lineTo(x+7,GROUND+30);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle='#bfe9ff';ctx.lineWidth=1.6;ctx.lineCap='round';
    for(let i=0;i<4;i++){const wx=x+9+i*(mw-18)/3+Math.sin(G.time*2+i)*3;ctx.beginPath();ctx.moveTo(wx-5,GROUND+7);ctx.quadraticCurveTo(wx,GROUND+3.5,wx+5,GROUND+7);ctx.stroke();}
  }
  const busy=G.state==='wave'&&G.zombies.some(z=>z.inMoat>0);
  if(m>=3){croc(x+15,GROUND+9,1,busy);croc(x+mw-15,GROUND+9,-1,busy);}
  if(m>=4)hippo(x+mw/2,GROUND+11,G.hippoA>0);
  /* the drawbridge: up against the zombies, down for Bob's pickup and Tom's dogs */
  const near=(G.car&&G.car.x>x-150&&G.car.x<x+mw+60)||G.dogs.some(d=>d.st!=='home'&&d.x>x-70&&d.x<x+mw+40);
  G.bridge+=((near?1:0)-G.bridge)*Math.min(1,dt*9);
  ctx.save();ctx.translate(x-8,GROUND-1);ctx.rotate(-(1-G.bridge)*1.42);
  box(0,-4,mw+16,5,'#b9824a',2.2);ctx.strokeStyle='#8b5a3c';ctx.lineWidth=1.5;for(let i=10;i<mw+12;i+=10){ctx.beginPath();ctx.moveTo(i,-4);ctx.lineTo(i,1);ctx.stroke();}
  ctx.restore();
  box(x-13,GROUND-13,6,13,'#5b5570',2);
}
/* fire drawn as flame tongues */
function flame(x,y,h,w,ph,a,heat){
  const fl=Math.sin(G.time*11+ph),hh=h*(.8+.2*Math.sin(G.time*17+ph*1.3)),L=[['#ff5d3c',1],['#ff8a3c',.72],['#ffe27a',.42]];
  if(heat>=2)L.push(['#fff1d0',.26]);if(heat>=3)L.push(['#9fd8ff',.15]);   /* hotter fire gets a white, then a blue heart */
  for(const [c,k] of L){
    ctx.globalAlpha=Math.max(0,Math.min(1,a*.9));ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x-w*k,y);
    ctx.bezierCurveTo(x-w*1.3*k,y-hh*.5*k,x-w*.2*k+fl*3,y-hh*.7*k,x+fl*5*k,y-hh*k);
    ctx.bezierCurveTo(x+w*.5*k+fl*2,y-hh*.6*k,x+w*1.3*k,y-hh*.35*k,x+w*k,y);ctx.closePath();ctx.fill();
  }
  ctx.globalAlpha=1;
}
/* raptor, triceratops, pterodactyl and the T-rex: zombies too, ribs showing */

    if(ph){document.querySelector('.hud').append($('autoBtn'));$('autoBtn').textContent='Non-stop waves';opts.append($('storeBtn'),$('bkBtn'),$('godBtn'),$('resetBtn'));panel.append(desk,$('sideL'),opts);mid.append(panel);}
    else{
      mid.append(desk);app.prepend($('sideL'));$('autoBtn').textContent='Continuous waves';document.querySelector('.hud').append($('autoBtn'),$('storeBtn'),$('bkBtn'),$('godBtn'),$('resetBtn'));panel.remove();
      app.classList.remove('land','port','strip');
      if(!SIDES.L.some(t=>t[0]===G.tab.L))G.tab.L='guns';
    }
    renderSides();
  }
  if(ph){
    const I=insets(),bar=land?42:0,use=vw-I.l-I.r,sw0=land?Math.min(use-104,(vh-bar)*16/9):vw,sw=sw0+(land?I.l:0);
    app.classList.toggle('land',land);app.classList.toggle('port',!land);
    const set=(k,v)=>app.style.setProperty(k,v+'px');
    set('--sw',sw);set('--sh',sw0*9/16);set('--bar',bar);set('--pl',Math.max(sw*.5,vw-420-I.r));
    set('--hw',I.l+use*(use<=760?.53:.46));set('--il',I.l);set('--ir',I.r);set('--it',I.t);set('--ib',I.b);
    showPanel();
  }
}
window.addEventListener('resize',layout);window.addEventListener('orientationchange',()=>setTimeout(layout,200));

/* ask the browser not to evict the save, write it again whenever the app is put away, and pick up the IndexedDB copy if it is the newer one */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}
const saveIdle=()=>{if(isIdle())save();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveIdle();});window.addEventListener('pagehide',saveIdle);
/* take over a copy from elsewhere if it is newer than what this device has, but never in the middle of a game */
function adopt(txt){const o=parseSave(txt);
  if(!o||(o.ts||0)<=(M.ts||0)||G.state!=='menu')return false;
  M=Object.assign(M,o);M.god=SLOT==='sand';Object.assign(G,{wave:M.wave||1});G.house=M.house==null?houseMax():Math.min(M.house,houseMax());G.fence=M.fence==null?fenceMax():Math.min(M.fence,fenceMax());
  lsSet(SKEY,JSON.stringify(M));syncToggles();renderSides();renderDesk();return true;}
function adoptOwn(txt){try{const o=JSON.parse(txt||'null');let ch=false;if(o)for(const k in o)if(o[k]&&!OWN[k]){OWN[k]=o[k];ch=true;}if(ch){lsSet(KEY+'-own',JSON.stringify(OWN));syncToggles();}return ch;}catch(e){return false;}}
idbOpen(()=>{
  idbGet(SKEY,txt=>{if(!adopt(txt)&&M.ts)idbPut(SKEY,JSON.stringify(M));});
  idbGet(KEY+'-own',txt=>{if(!adoptOwn(txt))idbPut(KEY+'-own',JSON.stringify(OWN));});
});
cloudGet(SKEY,adopt);cloudGet(KEY+'-own',adoptOwn);
/* the store version reports what the store says is owned: granted here, whatever the device storage says */
window.BobGame={owned(keys){let ch=false;for(const k of keys)if(!OWN[k]){OWN[k]=true;ch=true;}if(ch){saveOwn();syncToggles();}}};
if(window.BobStore&&window.BobStore.start)window.BobStore.start();
if(!OWN.tut&&SLOT==='main'&&M.wave===1&&!Object.keys(M.T).length)tutorial(0);   /* first run only */
