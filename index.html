<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#16122e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bob's House">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Bob's House Defense</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Manrope:wght@500;700&display=swap">
<style>
/* Layout: the playfield sits in the middle with its HUD, skills and a small decision desk; the six upgrade
   lines live in two side panels (three tabs each) so every purchase is visible on the playfield at once.
   One committed look: cartoon dusk, sticker-style cards with hard offset shadows. */
:root{
  color-scheme:dark;
  --ink:#16122e;        /* page ground, outlines */
  --desk:#231d47;       /* panels */
  --desk-2:#30285e;
  --paper:#fff1d0;      /* text */
  --muted:#b9add9;
  --pumpkin:#ff8a3c;    /* weapons, primary action */
  --plank:#f2c14e;      /* fence, coins */
  --brick:#5fc9c0;      /* house */
  --folk:#f29bc0;       /* people */
  --slime:#8fd14f;      /* obstacles */
  --steel:#a9b8d6;      /* fortification */
  --hurt:#ff5d73;
  --display:"M PLUS Rounded 1c","Trebuchet MS","Segoe UI",sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-inline:16px;padding-block:12px}
.app{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr) minmax(220px,300px);gap:14px;max-width:1580px;margin-inline:auto;align-items:start}
.mid{display:flex;flex-direction:column;gap:10px;min-width:0}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.hud h1{font-family:var(--display);font-weight:900;font-size:20px;margin:0;letter-spacing:.01em;flex:1 1 auto;min-width:0}
.hud h1 span{color:var(--pumpkin)}
.stat{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.stat b{font-family:var(--display);font-weight:800;font-size:18px}
.stat.coin b{color:var(--plank)}
.bars{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.bar{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;flex:1 1 180px;min-width:0}
.track{flex:1;height:14px;background:var(--desk);border:2px solid var(--ink);outline:2px solid var(--desk-2);border-radius:8px;overflow:hidden;min-width:50px}
.track i{display:block;height:100%;width:100%;background:var(--brick);transition:width .15s}
.bar.fence .track i{background:var(--plank)}
.bar .num{font-family:var(--display);font-weight:800;min-width:4.5em;text-align:right}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
.tog{font-family:var(--display);font-weight:800;font-size:13px;background:var(--desk-2);border:2px solid var(--muted);
  border-radius:10px;padding:4px 10px;white-space:nowrap}
.tog:hover{background:var(--desk)}
.tog[aria-pressed="true"]{background:var(--plank);color:var(--ink);border-color:var(--ink)}
.tog.speed{font-size:16px;min-width:52px}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;
  border:3px solid var(--desk-2);background:#23235e}
canvas{display:block;width:100%;height:100%;cursor:pointer}
.toast{position:absolute;left:12px;right:12px;bottom:10px;margin-inline:auto;max-width:600px;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:6px 14px;font-weight:700;text-align:center;
  font-size:14px;line-height:1.3;cursor:pointer}
.desk{background:var(--desk);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.desk h2{font-family:var(--display);font-weight:900;font-size:20px;margin:0;text-wrap:balance}
.desk p{margin:0;max-width:65ch;color:var(--muted)}
.desk p strong{color:var(--paper)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{text-align:left;border:3px solid var(--ink);border-radius:12px;padding:8px 12px 10px;color:var(--ink);
  box-shadow:4px 4px 0 var(--ink),4px 4px 0 2px var(--desk-2);display:flex;flex-direction:column;gap:2px;transition:transform .08s}
.card:hover{transform:translate(-2px,-2px)}
.card:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.card.weapon{background:var(--pumpkin)} .card.barricade{background:var(--plank)} .card.house{background:var(--brick)}
.card .cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;opacity:.75;display:flex;justify-content:space-between;gap:8px}
.card .nm{font-family:var(--display);font-weight:900;font-size:16px;line-height:1.2}
.card .ds{font-weight:700;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;color:var(--ink)}
.chip.weapon{background:var(--pumpkin)} .chip.barricade{background:var(--plank)} .chip.house{background:var(--brick)}
.chip.none{background:var(--desk-2);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.go{font-family:var(--display);font-weight:900;font-size:17px;background:var(--pumpkin);color:var(--ink);
  border:3px solid var(--ink);border-radius:12px;padding:7px 20px;box-shadow:4px 4px 0 var(--ink),4px 4px 0 2px var(--desk-2)}
.go:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.go.alt{background:var(--plank)}
.go.quiet{background:var(--desk-2);color:var(--paper);font-size:14px}
.go[disabled]{opacity:.45;cursor:default}
.subhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.log summary{cursor:pointer;font-weight:700;color:var(--folk)}
.log ol{margin:8px 0 0;padding-left:22px;color:var(--muted);display:flex;flex-direction:column;gap:4px;max-width:70ch;max-height:180px;overflow-y:auto}
/* player skills */
.skills{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:8px}
.auto{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;line-height:1.1;background:var(--desk);border:2px solid var(--desk-2);border-radius:10px;padding:2px 6px;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg)}
.auto[aria-pressed="true"]{background:var(--plank);color:var(--ink);border-color:var(--ink)}
.skill{position:relative;overflow:hidden;text-align:left;background:var(--desk);border:2px solid var(--desk-2);border-radius:12px;
  padding:6px 10px;min-width:0;display:flex;flex-direction:column;gap:1px}
.skill i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--desk-2);transition:width 1s linear}
.skill span{position:relative}
.skill .sn{font-family:var(--display);font-weight:900;font-size:14px}
.skill.ready{border-color:var(--plank)} .skill.ready .sn{color:var(--plank)}
.skill.ready:not([disabled]):hover{background:var(--desk-2)}
.skill.locked{border-style:dashed;opacity:.7}
.skill[disabled]{cursor:default}
/* side panels with the upgrade lines */
.side{background:var(--desk);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;position:sticky;top:12px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.tab{--c:var(--pumpkin);font-family:var(--display);font-weight:800;font-size:12px;line-height:1.15;background:var(--desk-2);border:2px solid transparent;
  border-radius:9px;padding:6px 4px;min-width:0;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--c);color:var(--ink);border-color:var(--ink)}
.t-guns{--c:var(--pumpkin)} .t-fence{--c:var(--plank)} .t-obst{--c:var(--slime)} .t-size{--c:var(--brick)} .t-fort{--c:var(--steel)} .t-people{--c:var(--folk)}
.nodes{display:flex;flex-direction:column;gap:5px}
.node{display:flex;gap:8px;align-items:flex-start;text-align:left;background:var(--desk-2);border:2px solid transparent;
  border-radius:10px;padding:5px 8px;min-width:0;font-size:12px;line-height:1.28}
.node .ic{width:32px;height:32px;flex:none;background:var(--ink);border-radius:8px;padding:3px;margin-top:1px}
.node .ic *{stroke:#16122e;stroke-width:1.1;stroke-linejoin:round;stroke-linecap:round}
.node .tx{display:flex;flex-direction:column;gap:0;min-width:0;flex:1}
.node .n{font-family:var(--display);font-weight:800;font-size:13.5px;display:flex;justify-content:space-between;gap:6px}
.node .n i{font-style:normal;color:var(--c);font-variant-numeric:tabular-nums;white-space:nowrap}
.node .d{color:var(--muted)}
.node .p{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.node.can{border-color:var(--c)} .node.can .p{color:var(--plank)}
.node.can:hover{background:var(--ink)}
.node.locked{background:transparent;border:2px dashed var(--desk-2);opacity:.85}
.node.maxed{border-color:var(--plank);background:linear-gradient(90deg,#4a3f2a,var(--desk-2))} .node.maxed .p,.node.maxed .n i{color:var(--plank)}
.node.flash{animation:unlock .7s ease-in-out 7}
@keyframes unlock{50%{background:var(--c);color:var(--ink);transform:scale(1.02)}}
@media (prefers-reduced-motion:reduce){.node.flash{animation:none;outline:3px solid var(--c)}}
.tab{position:relative}
.tab.done{box-shadow:inset 0 -4px 0 var(--plank);color:var(--plank)}
.tab.done[aria-selected="true"]{color:var(--ink)}
.tab.new::after{content:"";position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--hurt);border:2px solid var(--ink)}
.warn{display:flex;gap:12px;align-items:center;background:var(--desk-2);border:2px solid var(--hurt);border-radius:12px;padding:8px 12px;min-width:0}
.warn img{width:96px;height:80px;flex:none;background:var(--ink);border-radius:10px}
.warn div{display:flex;flex-direction:column;gap:2px;min-width:0}
.warn b{font-family:var(--display);font-weight:900;font-size:17px}
.warn span{color:var(--muted);font-size:13.5px} .warn span strong{color:var(--paper)}
.node[disabled]{cursor:default}
@media (max-width:1080px){
  .app{grid-template-columns:1fr 1fr}
  .mid{grid-column:1/-1;order:-1}
  .side{position:static}
}
@media (max-width:640px){
  .app{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .skills{grid-template-columns:auto repeat(2,minmax(0,1fr))}
  .auto{grid-row:span 2}
  .toast{font-size:12px;padding:5px 10px}
}

/* a dot marks what you can pay for right now: on the tab and on the upgrade itself */
.node.can{position:relative}
.node.can::after{content:"";position:absolute;top:-4px;left:-4px;width:11px;height:11px;border-radius:50%;background:var(--hurt);border:2px solid var(--ink)}
.tog.new{position:relative}
.tog.new::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--hurt);border:2px solid var(--ink)}
/* phone: everything on one screen, nothing scrolls except the upgrade list.
   Sideways the upgrades cover the right part of the yard between waves; upright they sit under the playfield. */
html.phone,html.phone body{height:100%;overflow:hidden;overscroll-behavior:none}
html.phone body{padding:0;font-size:13px}
html.phone button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html.phone .app{display:block;position:fixed;inset:0;max-width:none}
html.phone #sideR{display:none}
html.phone .mid{position:absolute;inset:0;gap:4px}
html.phone .hud h1{display:none}
html.phone .hud{gap:4px 10px;padding:4px 8px 0;flex-wrap:nowrap}
html.phone .stat{gap:4px} html.phone .stat b{font-size:15px} html.phone .lbl{font-size:9px}
html.phone .tog{font-size:11px;padding:3px 8px} html.phone .tog.speed{font-size:13px;min-width:40px;margin-left:auto}
html.phone .bars{padding:0 8px;gap:4px 10px;flex-wrap:nowrap}
html.phone .bar{flex:1 1 0;gap:5px} html.phone .track{height:9px;min-width:30px} html.phone .bar .num{font-size:11px;min-width:0}
html.phone .stage{border-radius:0;border:0;flex:none}
html.phone .skills{grid-template-columns:auto repeat(4,minmax(0,1fr));gap:4px;padding:0 6px}
html.phone .auto{grid-row:auto}
html.phone .skill{padding:3px 6px;border-radius:9px}
html.phone .skill .sn{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.phone .skill .st{font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.phone .toast{font-size:11px;padding:4px 8px;left:6px;right:6px;bottom:6px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
.panel{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;background:var(--desk);padding:6px 8px;overflow:hidden}
.panel[hidden]{display:none}
.panel .desk{padding:0 4px 4px 0;gap:6px;background:none;border-radius:0;flex:none;max-height:48%;overflow-y:auto}
.panel .desk h2{font-size:14px}
.panel .row h2{flex:1 1 120px}
.panel .row{gap:6px 10px}
.panel .go{font-size:14px;padding:5px 14px;box-shadow:3px 3px 0 var(--ink)}
.panel .go.quiet{font-size:11px;padding:4px 10px}
.panel .desk[data-st="menu"] p,.panel .log,.panel .subhead{display:none}
.panel .desk p{font-size:12px}
.panel .cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.panel .card{padding:5px 7px 6px;box-shadow:3px 3px 0 var(--ink)}
.panel .card .nm{font-size:13px} .panel .card .ds{font-size:11px;font-weight:600} .panel .card .cat{font-size:9px;letter-spacing:.04em}
.panel .chip{font-size:11px;padding:2px 8px}
.panel .warn{padding:5px 8px;gap:8px} .panel .warn img{width:60px;height:50px} .panel .warn b{font-size:14px} .panel .warn span{font-size:11.5px;line-height:1.3}
.panel .side{background:none;padding:0;position:static;flex:1;min-height:0;gap:6px;border-radius:0}
.panel .tabs{gap:3px;flex:none}
.panel .tab{font-size:9.5px;letter-spacing:-.02em;padding:11px 0 5px}
.panel .tab.new::after{top:1px;right:1px;width:8px;height:8px;border-width:1.5px}
.panel .desk[data-st="menu"] h2{display:none}
.app.land .panel{overflow-y:auto;-webkit-overflow-scrolling:touch;display:block}
.app.land .panel>*{margin-bottom:6px}
.app.land .panel .desk{max-height:none;overflow:visible}
.app.land .panel .side{display:block}
.app.land .panel .tabs{position:sticky;top:-6px;z-index:2;background:var(--desk);padding:6px 0}
.app.land .panel .nodes{overflow:visible}
.panel .nodes{flex:1;min-height:0;grid-auto-rows:max-content;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));align-content:start;gap:6px;padding:5px 3px 3px 5px}
.panel .opts{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.app.land .stage{position:absolute;left:0;top:0;width:var(--sw);max-width:none}
.app.land .hud{position:absolute;z-index:2;left:6px;top:4px;width:calc(var(--pl) - 12px);padding:2px 8px;background:rgba(22,18,46,.6);border-radius:10px}
.app.land .bars{position:absolute;z-index:2;left:6px;top:34px;width:calc(var(--pl) - 12px);padding:2px 8px;background:rgba(22,18,46,.6);border-radius:10px}
.app.land .panel{position:absolute;z-index:3;top:0;bottom:0;right:0;left:var(--pl);border-left:3px solid var(--desk-2)}
.app.land .skills{position:absolute;z-index:2;left:calc(var(--sw)*.4);width:calc(var(--sw)*.59);bottom:4px;padding:0}
.app.land .skill{background:rgba(35,29,71,.88)}
.app.land.strip .skills{left:calc(var(--sw) + 5px);right:5px;width:auto;top:5px;bottom:5px;grid-template-columns:1fr;grid-template-rows:auto repeat(4,minmax(0,1fr))}
.app.land.strip .auto{writing-mode:horizontal-tb;transform:none;padding:5px}
.app.land.strip .skill{justify-content:center;padding:4px 8px} .app.land.strip .skill .sn{font-size:13px} .app.land.strip .skill .st{font-size:9px}
.app.land .toast{right:auto;width:calc(var(--pl) - 12px);max-width:none;margin:0}

/* phone, second pass: finger-sized buttons, nothing drawn over the playfield, upgrades only between waves */
html.phone .tog{min-height:34px;font-size:12px;padding:4px 12px}
html.phone .tog.speed{min-width:52px;font-size:15px}
html.phone .skill{min-height:44px;justify-content:center}
html.phone .auto{min-width:30px}
html.phone .toast{top:6px;bottom:auto;left:30%;right:6px;margin:0;max-width:none}
.panel .go{font-size:16px;padding:10px 20px}
.panel .go.quiet{font-size:12px;padding:9px 12px}
.panel .tab{min-height:42px;font-size:10px}
.panel .node{padding:8px 10px;font-size:12.5px;min-height:58px}
.panel .node .n{font-size:14px}
.panel .card{padding:8px 9px 9px;min-height:64px}
.panel .opts .tog{min-height:40px}
.panel.inwave .side,.panel.inwave .opts{display:none}
html.phone .panel[hidden]{display:none!important}
.panel.inwave::after{content:"The shop opens again when the wave ends.";color:var(--muted);font-size:12px}
.app.land .hud{left:0;top:0;width:46%;height:var(--bar);padding:0 8px;background:none;border-radius:0;align-items:center}
.app.land .bars{left:46%;top:0;width:54%;height:var(--bar);padding:0 8px 0 0;background:none;border-radius:0;align-items:center}
.app.land .stage{top:var(--bar)}
.app.land .panel{top:var(--bar)}
.app.land .skills{left:calc(var(--sw) + 5px);right:5px;width:auto;top:calc(var(--bar) + 4px);bottom:5px;grid-template-columns:1fr;grid-template-rows:auto repeat(4,minmax(0,1fr))}
.app.land .auto{writing-mode:horizontal-tb;transform:none;padding:6px;min-height:30px}
.app.land .skill{padding:4px 8px} .app.land .skill .sn{font-size:13px;white-space:normal} .app.land .skill .st{font-size:9px;white-space:normal}
.app.land .toast{left:34%;right:6px;width:auto;top:6px;bottom:auto}
/* the lines for what you bought are read here, just before the wave */
.brief{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(22,18,46,.66);padding:8px 12px;cursor:pointer}
.brief[hidden]{display:none}
.brief h3{font-family:var(--display);font-weight:900;font-size:17px;margin:0;color:var(--plank)}
.brief ul{list-style:none;margin:0;padding:0 2px;display:flex;flex-direction:column;gap:5px;max-width:560px;width:100%;min-height:0;overflow-y:auto}
.brief li{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:5px 10px;font-weight:700;font-size:13px;line-height:1.3}
.brief .go{flex:none;font-size:16px;padding:8px 26px}
.brief{cursor:default;padding-right:132px}
.brief .go{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:14px;min-width:104px;min-height:56px;font-size:20px}
/* coins: top left, big, with a coin next to the number */
.hud .stat.coin{align-items:center;gap:7px}
.hud .stat.coin b{font-size:26px;line-height:1}
.cn{flex:none;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a6 0 18%,var(--plank) 20% 100%);border:2.5px solid var(--ink);box-shadow:inset 0 0 0 3px #d99a1e,0 0 0 1.5px var(--plank)}
html.phone .hud .stat.coin{order:-1}
html.phone .hud .stat.coin b{font-size:24px}
html.phone .cn{width:22px;height:22px}
/* phone: Start sits under the right thumb, the speed button in the top right corner */
html.phone #startBtn,html.phone #againBtn{position:fixed;z-index:6;right:max(10px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));min-height:58px;font-size:18px;padding:10px 22px}
.app.land .panel{padding-bottom:84px}
.app.port .panel .nodes{padding-bottom:84px}
.app.land .bars{width:calc(54% - 118px)}
.app.land #speedBtn{position:fixed;z-index:5;top:4px;right:max(8px,env(safe-area-inset-right,0px));width:100px;min-height:34px;margin:0;font-size:17px}
.app.port #speedBtn{min-width:64px;min-height:38px;font-size:17px}
.card.c-guns,.chip.c-guns{background:var(--pumpkin)} .card.c-fence,.chip.c-fence{background:var(--plank)} .card.c-obst,.chip.c-obst{background:var(--slime)}
.card.c-fort,.chip.c-fort{background:var(--steel)} .card.c-size,.chip.c-size{background:var(--brick)} .card.c-people,.chip.c-people{background:var(--folk)}

.node.wait{opacity:.6}
.panel .turn{font-size:11px;flex:none}

.card .cat{opacity:1;color:rgba(22,18,46,.75)}
.card .ct{background:var(--ink);color:var(--paper);border-radius:999px;min-width:30px;padding:1px 8px;font-family:var(--display);font-weight:900;font-size:14px;letter-spacing:0;text-align:center;line-height:1.3}
.card .ds.up{border-top:2px dashed rgba(22,18,46,.4);margin-top:3px;padding-top:3px}
.panel .card .ct{font-size:12px;min-width:26px;padding:0 6px}
/* non-stop waves can always be switched off: the button sits in the top bar on the phone */
html.phone #autoBtn{width:66px;min-height:34px;padding:1px 4px;font-size:10px;line-height:1.1;white-space:normal;text-align:center;flex:none}
.app.land #autoBtn{margin-left:auto}
.app.port #speedBtn{min-width:52px}
html.phone .hud{gap:4px 8px}
.app.land .bar .num{white-space:nowrap}
@media (max-width:760px){.app.land .bar .lbl{display:none}}

<body>
<div class="app">
  <aside class="side" id="sideL" aria-label="Upgrades: weapons, fence, obstacles"></aside>
  <main class="mid">
    <header class="hud">
      <h1>Bob's <span>House Defense</span></h1>
      <div class="stat coin" aria-label="Coins"><span class="cn" aria-hidden="true"></span><b id="hudCoins">0</b></div>
      <div class="stat"><span class="lbl">Wave</span><b id="hudWave">1</b></div>
      <div class="stat"><span class="lbl">Zombies</span><b id="hudLeft">0</b></div>
      <button class="tog speed" id="speedBtn" type="button" aria-label="Game speed">x1</button>
      <button class="tog" id="shopBtn" type="button" aria-pressed="false" hidden>Upgrades</button>
      <button class="tog" id="autoBtn" type="button" aria-pressed="false">Continuous waves</button>
      <button class="tog" id="godBtn" type="button" aria-pressed="false">God mode</button>
      <button class="tog" id="resetBtn" type="button" hidden>Reset upgrades</button>

    <div class="bars">

      <div class="bar fence"><span class="lbl">Fence</span><div class="track"><i id="hudFence"></i></div><span class="num" id="hudFenceN"></span></div>
    </div>
    <div class="stage"><canvas id="cv" aria-label="Bob's house and the zombies closing in"></canvas><div class="toast" id="toast" role="status" hidden></div></div>
    <div class="skills" id="skills">
      <button class="auto" id="askBtn" type="button" aria-pressed="false" title="Use each skill automatically as soon as it is ready">auto</button>
      <button class="skill" id="skill-mud" type="button" data-skill="mud"><i></i><span class="sn">Sprinklers</span><span class="st lbl"></span></button>
      <button class="skill" id="skill-holy" type="button" data-skill="holy"><i></i><span class="sn">Exorcism</span><span class="st lbl"></span></button>
      <button class="skill" id="skill-air" type="button" data-skill="air"><i></i><span class="sn">Airstrike</span><span class="st lbl"></span></button>
      <button class="skill" id="skill-beam" type="button" data-skill="beam"><i></i><span class="sn">Space laser</span><span class="st lbl"></span></button>
    </div>
    <section class="desk" id="desk" aria-live="polite"></section>
  </main>
  <aside class="side" id="sideR" aria-label="Upgrades: house, fortification, people"></aside>
</div>

  const n=Math.min(BAL.nMax,Math.round(BAL.n0+Math.min(w,BAL.nKnee)*BAL.n1+Math.max(0,w-BAL.nKnee)*BAL.n2)),q=[],pool=MIX.filter(m=>w>=m[1]).map(m=>[m[0],Math.min(m[4],m[2]+m[3]*(w-m[1]))]);
  const total=pool.reduce((s,p)=>s+p[1],0);

/* how much tougher wave w is than wave 1 */
function scaleOf(w){
  /* zombie health follows a table with one value every ten waves (wave 1, 10, 20 ... 100), blended smoothly in between and extended past 100 */
  const T=BAL.tab,x=w<=1?0:w<10?(w-1)/9:Math.min(T.length-1.001,w/10),i=Math.floor(x),f=x-i;
  let hp=Math.exp(Math.log(T[i])*(1-f)+Math.log(T[Math.min(T.length-1,i+1)])*f)*BAL.mul;
  if(w>100)hp*=Math.pow(1.06,w-100);
  return {hp:BAL.force||hp,dmg:Math.min(1,BAL.ease+BAL.easeStep*w)*Math.pow(1+BAL.b*(w-1),BAL.q)};
}

  G.zombies.push({type,t,fly:!!t.fly,x:at||W+30+Math.random()*40,y:t.rain?112:t.drops?150+Math.random()*40:t.fly?250+Math.random()*70:GROUND,

    r:t.r,h:t.h,cd:t.cd*Math.random(),anim:Math.random()*6,flash:0,atk:0,dead:false,v:0,inMoat:0,moated:false,hop:0,burn:0,burnDps:0,frozen:0,held:0,slow:0,gated:false,dog:false,
    arm:w>=BAL.armW&&!t.boss&&!t.veh&&!t.dino&&t.hp<=35&&Math.random()<Math.min(BAL.armMax,.1+BAL.armStep*(w-BAL.armW)),cargoLeft:t.cargo||0,sT:2,scT:5,rT:3,rope:0,carry:!!t.carry,yard:!!yard,mark:false,hitOnce:false,parked:false,unT:0,kb:0,toss:0,cl:0,moatT:1.5,clm:Math.random()<.6&&!t.boss&&!t.veh&&!t.dino&&!t.fly&&!t.shield});

function ignite(z,dps,t){if(z.t.fireproof)return;z.burn=Math.max(z.burn,t);z.burnDps=Math.max(z.burnDps,dps);}
function useSkill(id){

function dmgMul(){return Math.pow(G.hm||1,BAL.hexp)*BAL.help*BAL.arm[tl('armory')];}

function hit(z,d,crit){

function shoot(p,len,z,d,spread,kind,pierce,sp){
  sp=sp||640;
  const ty=z.y-z.h*.55,dist=Math.hypot(z.x-p.x,ty-p.y),tx=z.x-z.v*(dist/sp);
  const a=Math.atan2(ty-p.y,tx-p.x)+(spread||0);

function explode(x,y,R,d,list,pct,lime,cap){
  G.bombs.push({x1:x,y1:y,boom:lime?.6:.3,done:true,R,t:0,dur:0,lime});

  for(const z of list.filter(z=>Math.hypot(z.x-x,z.y-z.h*.5-y)<R+z.r).sort((a,b)=>Math.abs(a.x-x)-Math.abs(b.x-x))){if(left--<=0)break;hit(z,d+(pct?z.max*BAL.pct*(z.t.boss?pct*.3:pct):0));}

/* ---------- simulation ---------- */
function update(dt){
  G.time+=dt;

  G.spawnT-=dt;
  if(G.queue.length&&G.spawnT<=0){spawn(G.queue.shift());G.spawnT=G.spawnGap*(.6+Math.random()*.8);}

  if(G.hippoT>0)G.hippoT-=dt;if(G.hippoA>0)G.hippoA-=dt;
  const armor=armorNow(),aura=G.zombies.some(q=>!q.dead&&q.t.aura)?1.2:1,holyWater=tl('priest')>=3,shock=tl('tania')>=3;
  for(const k in G.cd)if(G.cd[k]>0)G.cd[k]-=dt;

  for(const zp of G.zaps)zp.t-=dt;G.zaps=G.zaps.filter(z=>z.t>0);
  /* Ross fixes whatever needs fixing: first the house, then the fence */
  const rl=tl('ross');
  if(rl>=1){
    const rs=(rl>=4?2:1)*(1+.03*G.wave);
    if(G.house<houseMax())G.house=Math.min(houseMax(),G.house+1.5*rs*dt);
    else if(rl>=3&&G.fence<fenceMax())G.fence=Math.min(fenceMax(),G.fence+3*rs*dt);

  for(const z of G.zombies){
    if(z.dead)continue;

    if(z.toss>0){z.toss-=dt;z.v=0;continue;}           /* in the air, courtesy of the hippo */

      for(const c of G.clouds)if(c.dps&&Math.abs(z.x-c.x)<c.R)sear(z,(c.dps+z.max*BAL.pct*c.pct*(z.t.boss?.3:1))*dt);

    }
    if(z.frozen>0){z.frozen-=dt;z.v=0;if(holyWater)sear(z,z.max*BAL.pct*(z.t.boss?.015:.05)*dt);continue;}
    if(z.held>0){z.held-=dt;z.v=0;continue;}
    z.anim+=dt;
    if(z.t.boss&&!z.t.mini)bossTick(z,dt);
    let sp=z.sp*(z.slow>0?.4:1)*(z.t.aura?1:aura),stop;
    if(z.fly){   /* flyers ignore mud, wire, moat, mines and the fence */
      stop=z.stopX;z.y+=Math.sin(z.anim*3)*12*dt;
      /* a zombie helicopter hovers and lowers three walkers on a rope, one at a time, before it comes for the house */
      if(z.t.drops&&z.dropN<3&&z.x<=stop){
        z.v=0;
        if(z.rope>0){z.rope-=dt;if(z.rope<=0){z.dropN++;spawn('walker',z.x-2);z.cd=2.2;if(z.dropN>=3)z.stopX=320;}}

      /* nothing on wheels gets over a moat: bikes and cars end up nose-down in it */

      if(moat&&!z.moated&&!z.t.crash&&z.x<MOAT_X+mw+(z.t.jump?14:-mw*.25)){
        z.moated=true;
        if(z.t.jump)z.hop=.5;                               /* jumpers clear the moat in one leap */
        else{z.inMoat=z.moatT=hold*(z.t.boss?.5:1);z.x=MOAT_X+mw*(.3+Math.random()*.4);}
      }
      if(z.inMoat>0){

        if(moat>=3)sear(z,(5*dmgMul()+z.max*BAL.pct*.06)*dt);          /* crocodiles */
        if(moat>=4&&G.hippoT<=0&&!z.t.boss&&!z.dead&&z.moatT-z.inMoat>.5){   /* the hippo returns one swimmer to sender */
          G.hippoT=BAL.hip;G.hippoA=.6;hit(z,16*dmgMul());z.inMoat=0;z.moated=false;z.y=GROUND;z.x=MOAT_X+mw+70+Math.random()*50;z.toss=.7;

          if(G.fence===0&&!G.sim)for(let i=0;i<14;i++)G.parts.push({x:FENCE_X+5,y:GROUND-Math.random()*70,vx:(Math.random()-.3)*260,vy:-Math.random()*260,t:.8,c:tl('wall')>=5?'#b5533c':tl('wall')===4?'#8fa3b8':'#b9824a',s:4+Math.random()*5});

  }
  G.mines=G.mines.filter(m=>!m.gone);
  const alive=G.zombies.filter(z=>!z.dead).sort((a,b)=>a.x-b.x);
  const seen=alive.filter(z=>z.x<W-10),grounded=seen.filter(z=>!z.fly);
  if(seen.length){
    const near=seen[0],fl=seen.filter(z=>z.fly),shielded=seen.filter(z=>z.shield>0);
    /* everyone picks targets by what they are good at: the tightest pack, the weakest, the strongest, whatever flies */
    const packOf=list=>{let best=list[0],bn=-1;for(const a of list){let c=0;for(const b of list)if(Math.abs(a.x-b.x)<70)c++;if(c>bn){bn=c;best=a;}}return best;};

function openTrees(){return Object.keys(TREE).filter(t=>NODES.some(n=>n.tree===t&&tl(n.id)<n.max));}
/* three random categories; the one you pick lets you buy one more upgrade there this turn */
function makeOffer(){
  const pool=openTrees(),o=[];
  while(o.length<3&&pool.length)o.push({id:pool.splice(Math.floor(Math.random()*pool.length),1)[0]});
  G.offer=o.length?o:null;
}
function waveCleared(){
  /* nothing resets between waves. Bob patches a little; Ross repairs a share that grows with his level, fence and house alike */
  const fix=repairShare();
  G.fence=Math.min(fenceMax(),G.fence+fix*fenceMax());G.house=Math.min(houseMax(),G.house+fix*houseMax());
  Object.assign(G,{bullets:[],bombs:[],drops:[],fires:[],throws:[],clouds:[],zaps:[],lobs:[],rockets:[],strike:null,beam:null,car:null,heli:null,missile:null,nbeam:null,mud:0,holy:0,stun:0});
  if(G.wave>M.best)M.best=G.wave;
  if(G.wave%5===0&&!G.sim)note(boast(G.wave));
  if(G.wave===100&&!G.sim){M.score=M.bank;note('Wave 100 beaten. Bob keeps his house! Final score: '+M.bank+' coins left in the piggy bank.');}
  G.picks++;if(!G.offer)makeOffer();
  if(!G.offer){G.picks=0;G.wave++;M.wave=G.wave;G.state='ready';G.autoWait=M.auto&&!G.sim?AUTO_WAIT:0;save();renderDesk();renderSides();return;}
  /* continuous waves: the next wave starts at once and the card can be picked while it runs */
  /* continuous waves: the shop opens for a few seconds, the card waits beside it, then the next wave starts by itself */
  if(M.auto&&!G.sim){G.wave++;M.wave=G.wave;G.state='ready';G.autoWait=AUTO_WAIT;save();renderDesk();renderSides();return;}
  G.state='cards';save();renderDesk();renderSides();
}
function pickCard(id,all){
  if(!G.offer)return;
  for(const c of all?G.offer.map(o=>o.id):[id]){G.extra[c]=(G.extra[c]||0)+1;G.half[c]=(G.half[c]||0)+1;}
  G.picks--;G.offer=null;if(G.picks>0)makeOffer();if(!G.offer)G.picks=0;
  if(G.state==='cards'&&!G.offer){
    G.wave++;G.state='ready';M.wave=G.wave;      /* the next wave waits for the Start button, or for the countdown when waves are continuous */
    G.autoWait=M.auto&&!G.sim?AUTO_WAIT:0;
  }else if(G.autoWait>0)G.autoWait=AUTO_WAIT;
  save();renderDesk();renderSides();
}
/* every fifth wave: a little boasting. The share is a formula that climbs with the wave, not a measurement */
function boast(w){
  const p=Math.min(99,Math.round(50+49*(1-Math.exp(-w/25)))),L=["Wave "+w+" beaten. You are better than "+p+"% of our players.","Wave "+w+" is history. That puts you ahead of "+p+"% of our players.",
    "Wave "+w+" cleared. Only "+(100-p)+"% of our players get this far.","Wave "+w+" down. Bob says you are better than "+p+"% of our players, and Bob never exaggerates."];
  return L[(w/5-1)%L.length];
}
function repairShare(){return tl('ross')?.2+.06*tl('ross'):.12;}
/* after a defeat the survivors patch things up overnight: 60%, not good as new */
function patchUp(){G.house=Math.max(G.house,Math.round(houseMax()*.6));G.fence=Math.max(G.fence,Math.round(fenceMax()*.6));}
function saveRepaired(){const h=G.house,f=G.fence;patchUp();save();G.house=h;G.fence=f;}
function gameOver(){
  G.state='over';if(G.wave-1>M.best)M.best=G.wave-1;
  G.house=0;saveRepaired();renderDesk();
}
/* what the next step of a line is, costs and needs. God mode waives both */
function nextOf(n){
  const l=tl(n.id),st=n.steps[l]||{};
  const req=(n.req||[]).concat(st.req||[]),tier=st.tier||0;
  let missing=req.filter(r=>tl(r[0])<r[1]).map(r=>{const q=NODES.find(x=>x.id===r[0]);return q.tree==='people'&&r[1]===1?q.nm:q.steps[r[1]-1].nm;});
  if(M.god)missing=[];
  if(l===0&&WIN.indexOf(n.id)>=0&&winUsed()>=winCount())missing.push('a free window: build another floor');
  return {l,maxed:l>=n.max,cost:M.god?0:Math.round(Math.max(n.cost*Math.pow(n.grow||1.5,l),tier?(15+BAL.cost*Math.pow(tier,1.3))*(1+BAL.late*Math.max(0,Math.min(1,(tier-30)/20))):0)*(G.half[n.tree]>0?.5:1)),half:!M.god&&G.half[n.tree]>0,missing,msg:st.msg,ds:st.ds,nm:st.nm};
}
/* every purchase says what changed */
function say(s){
  if(G.sim||!s)return;
  toast.textContent=s;toast.hidden=false;G.toastT=7;
}
function shut(){return PHONE&&G.state==='wave';}
function note(s){if(PHONE)(G.news=G.news||[]).push(s);else say(s);}
function buyNode(id){
  const n=NODES.find(x=>x.id===id);if(!n||shut())return;
  const nx=nextOf(n);if(nx.maxed||nx.missing.length||M.bank<nx.cost||!slotFree(n.tree))return;
  const before=houseMax(),fb=fenceMax();
  if(nx.l===0&&WIN.indexOf(id)>=0){M.W=M.W||{};const used=WIN.filter(p=>tl(p)).map(p=>M.W[p]);let sl=0;while(used.indexOf(sl)>=0)sl++;M.W[id]=sl;}   /* the next free window */
  M.bank-=nx.cost;M.T[id]=nx.l+1;if(!M.god){G.bought[n.tree]=(G.bought[n.tree]||0)+1;if(G.half[n.tree]>0)G.half[n.tree]--;}
  note(nx.msg);M.log.push(nx.msg);
  if(id==='floors'&&unsupported())note('The new floor sways! The house takes more damage until the Foundations are upgraded once more.');
  G.fence=Math.min(fenceMax(),G.fence+fenceMax()-fb);
  if(G.state==='over')saveRepaired();
  else{G.house=Math.min(houseMax(),G.house+houseMax()-before);save();}
  if(G.autoWait>0)G.autoWait=AUTO_WAIT;          /* every purchase restarts the countdown */
  renderSides();if(G.state!=='wave')renderDesk();
}

/* ---------- side panels and desk (DOM) ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function nodeState(n){
  const nx=nextOf(n),free=slotFree(n.tree),can=!nx.maxed&&!nx.missing.length&&M.bank>=nx.cost&&!shut()&&free;
  let p,cls='node';
  if(nx.maxed){p='Complete';cls+=' maxed';}
  else if(nx.missing.length){p='Needs '+nx.missing.join(', ');cls+=' locked';}
  else if(!free){p=nx.cost+' coins · one '+TREE[n.tree]+' upgrade per turn';cls+=' wait';}
  else{p=M.god?'Free in God mode':nx.cost+' coins'+(nx.half?' · half price with your card':'');if(can)cls+=' can';}
  if(G.unl[n.id]&&Date.now()-G.unl[n.id]<6000)cls+=' flash';
  return {nx,can,p,cls};
}
function renderSides(){
  if(G.sim)return;
  const SD=PHONE?{L:SIDES.L.concat(SIDES.R)}:SIDES;
  for(const s in SD){
    const cur=G.tab[s];
    let h='<div class="tabs" role="tablist">'+SD[s].map(t=>'<button type="button" role="tab" class="tab t-'+t[0]+tabCls(t[0],cur)+'" id="tab-'+t[0]+'" data-tab="'+t[0]+'" data-side="'+s+'" aria-selected="'+(t[0]===cur)+'">'+t[1]+'</button>').join('')+'</div>';
    h+='<div class="turn">'+(M.god?'God mode: no limits':slotFree(cur)?'This turn you can still buy '+(1+(G.extra[cur]||0)-(G.bought[cur]||0))+' '+TREE[cur]+' upgrade'+(1+(G.extra[cur]||0)-(G.bought[cur]||0)>1?'s':''):'Bought this turn. More after the next wave, or with a '+TREE[cur]+' card')+'</div>';
    h+='<div class="nodes t-'+cur+'" role="tabpanel">'+NODES.filter(n=>n.tree===cur).map(n=>{
      const st=nodeState(n),l=st.nx.l;
      let title=n.nm,d=n.ds;
      if(n.steps){
        const now=l?n.steps[l-1].nm:n.base;
        if(n.tree==='people'||n.max===1){title=n.nm;d=st.nx.maxed?(n.max===1?n.steps[0].ds:'Nothing more to learn'):(n.max===1?st.nx.ds:'Next: '+st.nx.nm+'. '+st.nx.ds);}
        else{title=now;d=st.nx.maxed?'The end of this line':'Next: '+st.nx.nm+'. '+st.nx.ds;}
      }
      return '<button type="button" class="'+st.cls+'" id="node-'+n.id+'" data-id="'+n.id+'"'+(st.can?'':' disabled')+'>'+
        '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+(ICON[n.id]||'')+'</svg><span class="tx">'+
        '<span class="n"><span>'+esc(title)+'</span><i>'+l+'/'+n.max+'</i></span><span class="d">'+esc(d)+'</span><span class="p">'+esc(st.p)+'</span></span></button>';
    }).join('')+'</div>';
    $('side'+s).innerHTML=h;
  }
}
/* coins change all the time: refresh prices and locks in place so a click is never lost */
function refreshSides(){
  for(const s of ['L','R'])for(const n of NODES){
    if(n.tree!==G.tab[s])continue;
    const el=$('node-'+n.id);if(!el)continue;
    const st=nodeState(n);
    if(el.className!==st.cls)el.className=st.cls;
    if(el.disabled===st.can)el.disabled=!st.can;
    const p=el.querySelector('.p');if(p.textContent!==st.p)p.textContent=st.p;
  }
  let any=false;
  for(const el of document.querySelectorAll('.tab')){const c=canTree(el.dataset.tab);any=any||c;el.classList.toggle('new',c);}
  $('shopBtn').classList.toggle('new',any||!!G.offer);
}
for(const s of ['L','R'])$('side'+s).addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');
  if(t){G.tab[t.dataset.side]=t.dataset.tab;renderSides();return;}
  const b=e.target.closest('[data-id]');if(b&&!b.disabled)buyNode(b.dataset.id);
});
function cardsHTML(){

function antics(z){
  const o={x:0,y:0,r:0,daze:false};
  if(z.kb>0)o.r=.2;
  if(z.toss>0){const k=1-z.toss/.7;o.y=-Math.sin(k*Math.PI)*120;o.r=k*9;return o;}
  if(z.inMoat>0){
    const e=(z.moatT||1.5)-z.inMoat;
    if(e<.35){o.r=-(e/.35)*6.28;o.y=-(1-e/.35)*24;}                       /* head over heels into the ditch */
    else if(tl('moat')>=2){o.y=Math.sin(z.anim*7)*2.5-3;o.r=Math.sin(z.anim*5)*.25;}   /* swimming, badly */
    else{const c=(e-.35)%1.15;if(c<.75)o.y=-c/.75*15;else{const k=(c-.75)/.4;o.y=-15*(1-k);o.r=-.7*Math.sin(k*Math.PI);}}   /* halfway up the bank, and back down */
    return o;
  }
  if(z.cl>0&&z.clm){
    const H=WALL[tl('wall')][2]*.55,T=z.cl%3.6;
    if(T<1.9)o.y=-H*(T/1.9)+Math.sin(T*20)*1.5;                           /* up the fence, hand over hand */
    else if(T<2.35){const k=(T-1.9)/.45;o.y=-H*(1-k*k);o.r=k*1.5;o.x=k*18;}   /* and off it, backwards */
    else if(T<3.1){o.r=1.5;o.x=18;o.daze=true;}
    else{const k=(T-3.1)/.5;o.r=1.5*(1-k);o.x=18*(1-k);}
  }
  return o;
}

    const tw=ctx.measureText(bb.s).width+20,bx=Math.max(tw/2+6,Math.min(W-tw/2-6,bb.x+30)),by=Math.max(22,bb.y-18);
    ctx.globalAlpha=Math.max(0,Math.min(1,bb.t*3));
    poly([bb.x+4,bb.y+2,bx-10,by+10,bx+6,by+10],'#fff1d0',2.5);rr(bx-tw/2,by-14,tw,26,9);fs('#fff1d0',2.5);
    ctx.fillStyle='#fff1d0';ctx.fillRect(bx-12,by+8,20,4);
    ctx.fillStyle='#16122e';ctx.fillText(bb.s,bx,by+4);ctx.globalAlpha=1;
    if(bb.t<=0)G.bubble=null;
  }
  if(G.state==='over'){ctx.fillStyle='rgba(22,18,46,.55)';ctx.fillRect(0,0,W,H);}
  ctx.restore();
}

/* ---------- loop ---------- */
let last=0,acc=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  acc+=dt*G.speed;let n=0;
  while(acc>=STEP&&n++<12){update(STEP);acc-=STEP;}
  if(n>=12)acc=0;
  if(G.state!=='wave')G.time+=dt;
  if(G.toastT>0){G.toastT-=dt;if(G.toastT<=0)toast.hidden=true;}
  if(G.state==='ready'&&G.autoWait>0&&!G.briefing){
    G.autoWait-=dt;
    if(G.autoWait<=0){G.autoWait=0;const nw=G.news||[];G.news=[];startWave(G.wave);if(nw.length)say(nw[nw.length-1]);else warnSay(G.wave);renderSides();}
    else{const b=$('startBtn'),lb=startLabel();if(b&&b.textContent!==lb)b.textContent=lb;}
  }
  draw(dt);updateHud();
  requestAnimationFrame(frame);
}

/* ---------- phone layout ---------- */
const app=document.querySelector('.app'),mid=document.querySelector('.mid'),panel=document.createElement('div'),opts=document.createElement('div');
panel.className='panel';panel.id='panel';opts.className='opts';
let PHONE=false;
function showPanel(){
  if(!PHONE)return;
  const land=app.classList.contains('land'),wave=G.state==='wave';
  panel.hidden=land&&(G.briefing||(wave&&!G.offer));
  panel.classList.toggle('inwave',wave);
  $('shopBtn').hidden=true;
}
const brief=document.createElement('div');brief.className='brief';brief.hidden=true;document.querySelector('.stage').append(brief);
function begin(fn){
  const items=[...new Set(G.news||[])].slice(-5);G.news=[];
  if(!PHONE||!items.length){fn();return;}
  
  brief.innerHTML='<h3>Before wave '+G.wave+'</h3><ul>'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><button class="go" type="button">Go!</button>';
  const done=()=>{if(!G.briefing)return;G.briefing=false;brief.hidden=true;fn();showPanel();};
  brief.hidden=false;G.briefing=true;showPanel();brief.querySelector('.go').onclick=done;
}
function layout(){
  const vw=window.innerWidth,vh=window.innerHeight,ph=vw<=940||vh<=520,land=vw>vh;
  if(ph!==PHONE){
    PHONE=ph;document.documentElement.classList.toggle('phone',ph);
    if(ph){document.querySelector('.hud').append($('autoBtn'));$('autoBtn').textContent='Non-stop waves';opts.append($('godBtn'),$('resetBtn'));panel.append(desk,$('sideL'),opts);mid.append(panel);}
    else{
      mid.append(desk);app.prepend($('sideL'));$('autoBtn').textContent='Continuous waves';document.querySelector('.hud').append($('autoBtn'),$('godBtn'),$('resetBtn'));panel.remove();
      app.classList.remove('land','port','strip');$('shopBtn').hidden=true;
      if(!SIDES.L.some(t=>t[0]===G.tab.L))G.tab.L='guns';
    }
    renderSides();
  }
  if(ph){
    const bar=land?42:0,sw=land?Math.min(vw-104,(vh-bar)*16/9):vw;
    app.classList.toggle('land',land);app.classList.toggle('port',!land);
    app.style.setProperty('--sw',sw+'px');app.style.setProperty('--bar',bar+'px');app.style.setProperty('--pl',Math.max(sw*.5,vw-420)+'px');
    showPanel();
  }
}
$('shopBtn').addEventListener('click',()=>{G.shop=!G.shop;showPanel();});
window.addEventListener('resize',layout);window.addEventListener('orientationchange',()=>setTimeout(layout,200));
layout();syncToggles();renderSides();renderDesk();updateHud();requestAnimationFrame(frame);

/* balance helper: plays from wave 1 with random card picks and no upgrades, until the first defeat */
function botBuy(){for(let g=0;g<40;g++){const can=NODES.map(n=>[n,nextOf(n)]).filter(x=>!x[1].maxed&&!x[1].missing.length&&M.bank>=x[1].cost&&slotFree(x[0].tree)).sort((a,b)=>a[1].cost-b[1].cost)[0];if(!can)break;buyNode(can[0].id);}}
window.__bob={BAL,
/* balance probe: plays an easy campaign and, at each listed wave, searches for the toughest zombies the bot's build of that moment still beats */
probe(list){
  const keep=JSON.stringify(M),P={},mul0=BAL.mul;G.sim=true;M=Object.assign(JSON.parse(keep),{T:{},bank:0,best:0,god:false,auto:false,autoSkill:true,log:[]});BAL.mul=mul0*.2;
  const trial=(w,m)=>{
    const sv={bank:M.bank,best:M.best,house:G.house,fence:G.fence,picks:G.picks,offer:G.offer,cd:Object.assign({},G.cd),L:Object.assign({},G.L)};
    BAL.force=m;G.house=houseMax()*.85;G.fence=fenceMax()*.85;startWave(w);let g=0;while(G.state==='wave'&&g++<300000)update(STEP);
    const won=G.state!=='over';BAL.force=0;M.bank=sv.bank;M.best=sv.best;Object.assign(G,{house:sv.house,fence:sv.fence,picks:sv.picks,offer:sv.offer,cd:sv.cd,L:sv.L,state:'ready',wave:w});return won;
  };
  startWave(1,true);let g=0;
  while(G.wave<=100&&g++<8e7){
    if(G.state==='wave')update(STEP);
    else if(G.state==='cards')pickCard(G.offer[Math.floor(Math.random()*G.offer.length)].id);
    else if(G.state==='ready'){
      botBuy();
      if(list.indexOf(G.wave)>=0){let lo=Math.log(.2),hi=Math.log(1e6);for(let i=0;i<12;i++){const mid=(lo+hi)/2;if(trial(G.wave,Math.exp(mid))&&trial(G.wave,Math.exp(mid)))lo=mid;else hi=mid;}P[G.wave]=Math.round(Math.exp(lo)*10)/10;}
      startWave(G.wave);
    }else if(G.state==='over'){botBuy();patchUp();startWave(G.wave);}
  }
  BAL.mul=mul0;M=JSON.parse(keep);G.sim=false;Object.assign(G,{state:'menu',L:M.L||{},wave:M.wave||1,zombies:[],bullets:[],bombs:[],parts:[],texts:[],throws:[],mines:[],dogs:[],drones:[],clouds:[],zaps:[],lobs:[],rockets:[],bees:[],picks:0,offer:null,car:null,heli:null,missile:null,ufo:null});
  G.house=M.house==null?houseMax():M.house;G.fence=M.fence==null?fenceMax():M.fence;return P;
},
/* one wave with a given set of upgrades: returns how it went */
wave(T,w,L){
  const keep=JSON.stringify(M);G.sim=true;M=Object.assign(JSON.parse(keep),{T,best:200,god:false,auto:false,autoSkill:true});G.L=L||{};G.house=houseMax();G.fence=fenceMax();
  startWave(w);G.house=houseMax();G.fence=fenceMax();const t0=G.time;let g=0,hp0=0;
  while(G.state==='wave'&&g++<200000)update(STEP);
  const out={won:G.state!=='over',secs:Math.round(G.time-t0),house:Math.round(G.house/houseMax()*100),fence:Math.round(G.fence/fenceMax()*100),walkerHp:Math.round(30*scaleOf(w).hp)};
  M=JSON.parse(keep);G.sim=false;Object.assign(G,{state:'menu',L:M.L||{},wave:M.wave||1,zombies:[],bullets:[],bombs:[],parts:[],texts:[],throws:[],mines:[],dogs:[],drones:[],clouds:[],zaps:[],lobs:[],rockets:[],bees:[],picks:0,offer:null,car:null,heli:null,missile:null,ufo:null});
  G.house=M.house==null?houseMax():M.house;G.fence=M.fence==null?fenceMax():M.fence;return out;
},campaign(maxWave,maxTries){
  const keep=JSON.stringify(M),tries={},secs={};G.sim=true;M=Object.assign(JSON.parse(keep),{T:{},bank:0,best:0,god:false,auto:false,autoSkill:true,log:[]});
  startWave(1,true);let total=0,g=0,t0=G.time;
  while(G.wave<=maxWave&&total<maxTries&&g++<4e7){
    if(G.state==='wave')update(STEP);
    else if(G.state==='cards'){secs[G.wave]=Math.round(G.time-t0);pickCard(G.offer[Math.floor(Math.random()*G.offer.length)].id);}
    else if(G.state==='ready'){botBuy();t0=G.time;startWave(G.wave);}
    else if(G.state==='over'){tries[G.wave]=(tries[G.wave]||0)+1;total++;botBuy();patchUp();t0=G.time;startWave(G.wave);}
  }
  const out={reached:G.wave,defeats:total,tries,secs,bank:M.bank,T:JSON.stringify(M.T)};
  M=JSON.parse(keep);G.sim=false;Object.assign(G,{state:'menu',L:M.L||{},wave:M.wave||1,zombies:[],bullets:[],bombs:[],parts:[],texts:[],throws:[],mines:[],dogs:[],drones:[],clouds:[],zaps:[],picks:0,offer:null,car:null,heli:null,missile:null});
  G.house=M.house==null?houseMax():M.house;G.fence=M.fence==null?fenceMax():M.fence;renderDesk();renderSides();return out;
},sim(runs){
  const keep=JSON.stringify(M),keepG={L:G.L,wave:G.wave,house:G.house},out=[];G.sim=true;M.T={};M.god=false;
  for(let i=0;i<runs;i++){startWave(1,true);let g=0;while(G.state!=='over'&&g++<3e6){if(G.state==='wave')update(STEP);else if(G.state==='cards')pickCard(G.offer[Math.floor(Math.random()*G.offer.length)].id);else startWave(G.wave);}out.push(G.wave);}
  M=JSON.parse(keep);G.sim=false;Object.assign(G,keepG,{state:'menu',zombies:[],bullets:[],bombs:[],parts:[],texts:[],throws:[],mines:[],dogs:[],drones:[],clouds:[],zaps:[],picks:0,offer:null,car:null,heli:null,missile:null,bubble:null});G.fence=fenceMax();renderDesk();renderSides();return out;
}};
})();
